name: TAKI 24/7 LIVE CHAT 👑

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 35000
    
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb pulseaudio unclutter dbus-x11 \
            ca-certificates fonts-liberation libasound2t64 libatk-bridge2.0-0t64 \
            libatk1.0-0t64 libc6 libcairo2 libcups2t64 libdbus-1-3 libexpat1 \
            libfontconfig1 libgbm1 libgcc-s1 libglib2.0-0t64 libgtk-3-0t64 libnspr4 \
            libnss3 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 libx11-6 \
            libx11-xcb1 libxcomposite1 libxcursor1 libxdamage1 \
            libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 \
            libxtst6 lsb-release wget xdg-utils
          npm install puppeteer
          
      - name: Create Stream Script
        run: |
          cat > stream.js << 'EOF'
          const puppeteer = require('puppeteer');
          const { spawn } = require('child_process');
          
          (async () => {
            try {
              console.log('1. Starting pulseaudio...');
              spawn('pulseaudio', ['--start', '--exit-idle-time=-1']);
              await new Promise(r => setTimeout(r, 2000));
              
              console.log('2. Launching browser...');
              const browser = await puppeteer.launch({
                headless: false,
                args: [
                  '--no-sandbox',
                  '--disable-setuid-sandbox',
                  '--disable-dev-shm-usage',
                  '--disable-gpu',
                  '--window-size=1280,720',
                  '--kiosk',
                  '--autoplay-policy=no-user-gesture-required',
                  '--disable-translate',
                  '--disable-features=TranslateUI',
                  '--lang=ar',
                  '--use-fake-ui-for-media-stream',
                  '--use-fake-device-for-media-stream'
                ]
              });
              
              const page = await browser.newPage();
              await page.setViewport({ width: 1280, height: 720 });
              
              console.log('3. Going to overlay...');
              if (!process.env.OVERLAY_URL) throw new Error('OVERLAY_URL مش موجود في Secrets');
              await page.goto(process.env.OVERLAY_URL, {
                waitUntil: 'networkidle2',
                timeout: 60000
              });
              
              await new Promise(r => setTimeout(r, 8000));
              
              console.log('4. Injecting chat + hiding stuff...');
              await page.evaluate((liveId) => {
                // 1. نحّي تبديل الأوضاع
                document.querySelectorAll('[class*="mode"], [class*="switch"], [id*="toggle"], [class*="theme"]').forEach(el => el.remove());
                
                // 2. شات شفاف فوق على اليسار + الكتيبة تبان
                if (liveId) {
                  const chat = document.createElement('iframe');
                  chat.src = `https://www.youtube.com/live_chat?v=${liveId}&embed_domain=onrender.com&dark_theme=1`;
                  chat.style.cssText = 'position:fixed;top:15px;left:15px;width:320px;height:450px;border:none;z-index:999;background:rgba(0,0,0,0.25);border-radius:8px;pointer-events:none;';
                  document.body.appendChild(chat);
                }
                
                // 3. نخبيو الماوس
                const style = document.createElement('style');
                style.innerHTML = '* { cursor: none !important; }';
                document.head.appendChild(style);
                
                // 4. نضغطو على زر الصوت
                document.body.click();
                const keywords = ['play','sound','audio','صوت','تشغيل','speaker','volume','unmute'];
                Array.from(document.querySelectorAll('button,div,i,span,a')).find(btn => {
                  const text = (btn.innerText + btn.className + btn.id).toLowerCase();
                  if(keywords.some(k => text.includes(k))) { btn.click(); return true; }
                });
              }, process.env.LIVE_ID);
              
              console.log('5. Starting ffmpeg...');
              if (!process.env.YOUTUBE_KEY) throw new Error('YOUTUBE_KEY مش موجود في Secrets');
              spawn('unclutter', ['-idle', '0', '-root']);
              
              const ffmpeg = spawn('ffmpeg', [
                '-f', 'x11grab', '-framerate', '30', '-video_size', '1280x720', '-i', ':99.0',
                '-f', 'pulse', '-i', 'default',
                '-c:v', 'libx264', '-preset', 'veryfast', '-b:v', '2500k', '-maxrate', '3000k', '-bufsize', '6000k', '-g', '60', '-pix_fmt', 'yuv420p',
                '-c:a', 'aac', '-b:a', '128k', '-ar', '44100',
                '-f', 'flv', `rtmp://a.rtmp.youtube.com/live2/${process.env.YOUTUBE_KEY}`
              ]);
              
              ffmpeg.stderr.on('data', (data) => console.log('FFMPEG:', data.toString()));
              ffmpeg.on('exit', (code) => {
                console.log('FFMPEG خرج بكود:', code);
                process.exit(code);
              });
              
            } catch (err) {
              console.error('خطأ قاتل:', err.message);
              process.exit(1);
            }
          })();
          EOF
          
      - name: Start Stream
        env:
          YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
          LIVE_ID: ${{ secrets.LIVE_ID }}
          OVERLAY_URL: ${{ secrets.OVERLAY_URL }}
          DISPLAY: ':99'
        run: |
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp -nolisten unix &
          sleep 3
          dbus-launch --exit-with-session node stream.js
